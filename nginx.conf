events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        # least_conn;
        server backend-1:4000;
        server backend-2:4000;
        server backend-3:4000;
    }

    server {
        listen 80;

        # Proxy all requests to backend pool
        location / {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # WebSocket support
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Optional: Expose individual backend instances for debugging
        location /backend-1/ {
            rewrite ^/backend-1/(.*) /$1 break;
            proxy_pass http://backend-1:4000;
        }

        location /backend-2/ {
            rewrite ^/backend-2/(.*) /$1 break;
            proxy_pass http://backend-2:4000;
        }

        location /backend-3/ {
            rewrite ^/backend-3/(.*) /$1 break;
            proxy_pass http://backend-3:4000;
        }
    }
}